name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build Cross-Platform Binaries
        run: |
          mkdir -p dist
          TAG_NAME=${GITHUB_REF#refs/tags/}

          platforms=(
            "linux/amd64/verifisci-linux-amd64"
            "linux/arm64/verifisci-linux-arm64"
            "darwin/amd64/verifisci-darwin-amd64"
            "darwin/arm64/verifisci-darwin-arm64"
            "windows/amd64/verifisci-windows-amd64.exe"
          )

          for p in "${platforms[@]}"; do
            IFS="/" read -r os arch filename <<< "$p"
            echo "Building $filename for $os/$arch..."
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -ldflags="-s -w" -o dist/$filename .
            if [ "$os" = "windows" ]; then
              zip -j "dist/verifisci-${TAG_NAME}-${os}-${arch}.zip" "dist/$filename"
            else
              tar -czvf "dist/verifisci-${TAG_NAME}-${os}-${arch}.tar.gz" -C dist "$filename"
            fi
          done

          cd dist
          sha256sum verifisci-*.* > checksums.txt
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
